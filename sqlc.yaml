version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: app/internal/user/db
    gen:
      go: &go
        package: db
        out: app/internal/user/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.interval
            go_type: time.Duration
  - engine: postgresql
    schema: migrations
    queries: app/internal/auth/db
    gen:
      go:
        <<: *go
        out: app/internal/auth/db
